<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terms & Conditions — PICK Social Club</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1f1620;
      background: #faf7ff;
    }
    .lang-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .lang-toggle button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background: #fff;
      color: #1f1620;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
    }
    .lang-toggle button.active {
      background: #3a2552;
      color: #fff;
      border-color: #3a2552;
    }
    .lang-toggle button:not(.active):hover {
      background: #f3eaf9;
      border-color: #3a2552;
      color: #3a2552;
    }
    h1 {
      color: #3a2552;
      margin-bottom: 10px;
    }
    .meta {
      color: #6f637c;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .content {
      white-space: pre-wrap;
      line-height: 1.7;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(58, 37, 82, 0.12);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 18px 38px -26px rgba(58, 37, 82, 0.35);
    }
    [dir="rtl"] body,
    [dir="rtl"] .content {
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
  </style>
</head>
<body>
  <h1 id="title">Terms & Conditions</h1>
  <div class="lang-toggle">
    <button data-lang="en" class="active">English</button>
    <button data-lang="ar">العربية</button>
  </div>
  <div class="meta" id="meta">Loading...</div>
  <div class="content" id="content">Loading...</div>
  <script>
    let terms = null;
    let lang = "en";

    async function load() {
      try {
        const response = await fetch("/api/terms");
        terms = await response.json();
        render();
      } catch (error) {
        document.getElementById("meta").textContent = "Could not load terms.";
        document.getElementById("content").textContent = "Please try again later.";
      }
    }

    function render() {
      if (!terms) return;
      const titleMap = { en: "Terms & Conditions", ar: "الشروط والأحكام" };
      const updatedAt = terms.updatedAt ? new Date(terms.updatedAt) : null;
      const metaMap = {
        en: `Version ${terms.version} · Last updated ${updatedAt ? updatedAt.toLocaleDateString("en-GB") : "-"}`,
        ar: `الإصدار ${terms.version} · آخر تحديث ${updatedAt ? updatedAt.toLocaleDateString("ar-KW") : "-"}`,
      };
      document.title = `${titleMap[lang]} — PICK Social Club`;
      document.getElementById("title").textContent = titleMap[lang];
      document.getElementById("meta").textContent = metaMap[lang];
      document.getElementById("content").textContent = lang === "ar" ? terms.textAr : terms.textEn;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll(".lang-toggle button").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === lang);
      });
    }

    document.querySelectorAll(".lang-toggle button").forEach((button) => {
      button.addEventListener("click", () => {
        lang = button.dataset.lang;
        render();
      });
    });

    load();
  </script>
</body>
</html>
